# @package _global_
# Reproducible pipeline defaults (Hydra). Override via CLI: model=caduceus epochs=5 …

defaults:
  - train: legnet
  - _self_

run_id: run0
mode: dry  # dry | run
data: prokaryotes
split: random
# Direct-task target type (continuous TPM / log2)
task_type: regression
# After adversarial fold-class rewrite
adversarial: true
adversarial_task_type: classification
seed: 42
# Max epochs (ceiling); early stop may end sooner after min_epochs.
epochs: 50
# Periodic weight dumps during train; final_model/ = best validation checkpoint
checkpoint_every_n_epochs: 10
# Early stop patience (0 disables). Caduceus: val_loss; LegNet: val_pearson.
early_stopping_patience: 10
# Minimum epochs before early stopping can fire (0 = no floor).
min_epochs: 25
n_devices: 4
batch_size: 1024
max_length: 512  # Caduceus tokenizer pad/truncate; override for short windows
num_workers: 8
# null → Caduceus-aligned (~81% train / ~9% val / ~10% test).
# Explicit values are always ordered train:test:val (same as split_predict --ratios).
ratios: null
panel_root: run/${run_id}
out_root: run/${run_id}
zsv: true
conda_env: legnet
# GC / SBS / hashfrag / kmer: MARKED or FNA root (null → panel_root/MARKED when needed)
marked: null
max_ids: null
# k-mer SBS (split=kmer): size(s) and counting engine (auto|native|cpp|python|dsk)
kmer_size: 5
kmer_engine: auto
log_transform: false
# hashFrag homology threshold (-t); required when split=hashfrag
threshold: null
# Optional hashFrag train/test proportions (must sum to 1); null → Caduceus-like defaults
p_train: null
p_test: null
# BLAST threads for split=hashfrag (null → 2 * n_devices); also kmer feature threads
threads: null
force: false
# Rerun-with-different-strategy (aligned suite under runs_aligned/).
# When rerun=true:
#   - default out_root → runs_aligned/${run_id} (unless out_root=… overridden)
#   - never overwrite existing out_root artifacts or the source run
#   - source_split=… → reuse that split.csv (+ stage intermediates); rematerialize SPLIT
#   - without source_split → new train:test:val at ~3:1:1 only (not Caduceus 81/9/10)
#   - schedule defaults: epochs=30, min_epochs=10, early_stopping_patience=10
#   - epoch eval caps remain 8192 (Caduceus --eval-max-samples)
rerun: false
source_split: null
plot_split: true
# After-train visualization (learning curves + SBS PCA on split.csv)
plot_train: true
plot_sbs: true
# Interpreter for matplotlib/cnsplots/altair when train conda_env lacks them
viz_conda_env: caduceus_env
# GC/SBS/kmer clustering: dbscan | kmeans | kmeans_elbow | pca_kmeans | auto
# (auto/dbscan on n>50k falls back to MiniBatchKMeans elbow)
cluster_method: auto
# blastp / pangenome A2A (null → defaults in hydra_pipeline for split=blastp)
gtf_dir: null
fna_dir: null
environment: null
window: null
genetic_code: universal

hydra:
  run:
    dir: run/${run_id}/hydra/${now:%Y-%m-%d_%H-%M-%S}
  job:
    chdir: false
