# Local conda install of GigaMario (editable) into the active env.
# Prefer: conda activate <env> && conda env update -f environment.yml --prune
# Or one-shot into current env: see README install section.
name: base
channels:
  - defaults
dependencies:
  - python>=3.10
  - pip
  - pip:
      - -e .
      - pytest>=8
      - pyfaidx>=0.8
      - cnsplots>=0.5.0
      - altair>=5
      - vl-convert-python>=1.0
