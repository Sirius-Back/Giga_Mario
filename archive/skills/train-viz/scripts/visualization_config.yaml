# Reproducible publication style for @train-viz
# Copied into each --outdir as visualization_config.yaml

style: Nature Methods / Nature Machine Intelligence
dpi_png: 600
figure_size_px:
  single: [1800, 1400]
  double: [3600, 2400]
font:
  family: [Arial, Helvetica, DejaVu Sans]
  axis_label_pt: 9
  tick_pt: 8
  legend_pt: 8
  title_pt: 10
line_width: 2.2
grid:
  which: major
  color: "#B0B0B0"
  alpha: 0.3
spines:
  top: false
  right: false
palette:
  train: "#0072B2"       # blue
  validation: "#E69F00"  # orange
  test: "#009E73"        # green
  zero_shot: "#CC79A7"
  _run: "#56B4E9"
  models:  # Okabe–Ito (multi-model)
    - "#0072B2"
    - "#E69F00"
    - "#009E73"
    - "#D55E00"
    - "#CC79A7"
    - "#56B4E9"
    - "#F0E442"
    - "#000000"
linestyle:
  train: solid
  validation: dashed
  test: dotted
  zero_shot: dashdot
  _run: solid
seed_aggregation: mean_ci95  # mean + 95% CI ribbons (alt: mean_std)
ribbon_default: ci95
never_smooth_stored_values: true
lowess_frac: 0.35
metric_direction:
  lower_is_better:
    - loss
    - mse
    - rmse
    - mae
    - elapsed_sec
  higher_is_better:
    - pearson
    - spearman
    - r2
    - r²
    - gene_wise_pearson
    - gene-wise pearson
    - genewise_pearson_median
    - sample_wise_pearson
    - sample-wise pearson
    - samplewise_pearson_median
    - accuracy
    - f1
    - auc
    - auroc
    - auprc
    - precision
    - recall
layout_grid:
  1: [1, 1]
  2: [1, 2]
  3: [1, 3]
  4: [2, 2]
  5: [2, 3]
  6: [2, 3]
  7: [2, 4]
  8: [2, 4]
  9: [3, 3]
qc:
  min_dpi: 600
  require_vector_fonts: true
  reject_default_matplotlib_style: true
  require_ci_when_multi_seed: true
