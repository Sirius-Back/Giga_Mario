# Default @adapt configuration (2026-07-27 Locked)

flank_bp: 10000
large_gene_bp: 130000
large_body_bp: 120000
rc_export: false
orientation_default: forward_only
target: TPM
target_type: continuous
label_column: TPM
sequence_type: DNA
window_strategy: cds_plus_10kb_neighbour_trim_v2
long_gene_policy: crop_10kb_plus_120kb
noncoding_match: length_and_gc_greedy
seed: 42
output_dir: data_ready

paths:
  raw_root: raw

files:
  fasta_dir: fna
  gtf_dir: gtf
  tpm_dir: tpm
  mapping: random_borzoi_expr_file_mappings.csv

assumptions_documented:
  - "Windows anchored on CDS span (min–max CDS), not full transcript"
  - "±10 000 bp flanks; neighbour CDS corners trim overlapping flanks"
  - "CDS length >130 000 → 10 kb before strand-aware start + 120 kb of CDS"
  - "Non-coding windows matched 1:1 to gene length & GC; TPM=0"
  - "Forward genomic sequence only"
  - "@adapt never assigns train/val/test folds"
  - "Entry point: src/preprocessing.py"
